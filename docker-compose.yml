services:
  db:
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_DATABASE: salt
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-development-root-password}
      MYSQL_USER: ${DB_USER:-alcali}
      MYSQL_PASSWORD: ${DB_PASS:-alcali}
    volumes:
      - ./docker/sql/mysql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-dev
      args:
        USER_ID: ${USER_ID:-1000}
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/opt/alcali/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - env.sample
  master:
    build:
      context: ./docker
      dockerfile: Dockerfile-master
    command: honcho start
    depends_on:
      - web
    environment:
      - PYTHONUNBUFFERED=true
    ports:
      - "8080:8080"
  minion:
    build:
      context: ./docker
      dockerfile: Dockerfile-minion
    command: salt-minion -l info
    depends_on:
      - master
