# Builds a tagged version and publishes it.
#
# The wheel is the only artifact that carries a usable Alcali: dist/ is build
# output and is not tracked, so a git checkout has no frontend at all. That is
# why this workflow exists rather than releases being cut by hand - a wheel
# built without the `pnpm build` step below installs cleanly and then serves
# every UI route as a 500.
#
# Order matters. Tests, then the wheel, then the release, and the container
# image last: a registry that refuses the push must not cost the release its
# artifacts.
name: release

on:
  push:
    tags:
      - 'v*'
  # Re-release an existing tag without moving it: this file comes from the
  # branch the workflow is dispatched on, the code from the tag named here.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v3008.11.1'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Resolve the version
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ref_name="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="${ref_name#v}"
          declared="$(tr -d '[:space:]' < VERSION)"
          if [ "${version}" != "${declared}" ]; then
            echo "Tag ${ref_name} declares version ${version}, but VERSION contains" >&2
            echo "${declared}. Update VERSION in the commit the tag points at, or the" >&2
            echo "published package carries a version that does not match the release." >&2
            exit 1
          fi
          case "${version}" in
            *dev*|*a[0-9]*|*b[0-9]*|*rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/alcali"
          {
            echo "tag=${ref_name}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${version}"
            # A prerelease must not move :latest.
            [ "${prerelease}" = "false" ] && echo "${image}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "releasing ${ref_name} (version ${version}, prerelease=${prerelease})"

      - name: Run the backend tests
        env:
          DB_BACKEND: sqlite3
          SECRET_KEY: ci-only
        run: |
          python -m pip install -r requirements/prod.txt -r requirements/test.txt
          pytest

      # dist/ is build output and untracked, so the bundle the wheel ships has
      # to be produced here, from this tag's sources.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Build the frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm lint --no-fix src
          pnpm test:unit
          pnpm build
          # The one thing that must not be silently missing.
          test -f dist/index.html

      - name: Drive the built bundle in a browser
        env:
          DB_BACKEND: sqlite3
          SECRET_KEY: ci-only
        run: |
          python -m playwright install --with-deps chromium
          pytest -m smoke

      # The Python build writes to build/release: dist/ now holds the frontend
      # bundle it is about to package.
      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir build/release
          python -m twine check build/release/*
          # Prove the wheel carries the frontend rather than trusting MANIFEST.
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("build/release/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "dist/index.html" not in names:
              sys.exit("{} has no frontend: installing it would serve no UI".format(wheel))
          print("{}: {} files, frontend included".format(wheel, len(names)))
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          {
            echo "Install the wheel directly:"
            echo
            echo '```'
            echo "pip install ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/alcali-${{ steps.release.outputs.version }}-py3-none-any.whl"
            echo '```'
            echo
            echo "See CHANGELOG.md for what changed."
          } > "${notes}"
          # Idempotent: a re-dispatch of an existing tag replaces the assets
          # rather than failing the run.
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.release.outputs.tag }}" build/release/* --clobber
          else
            gh release create "${{ steps.release.outputs.tag }}" build/release/* \
              --title "${{ steps.release.outputs.tag }}" \
              --notes-file "${notes}" \
              ${{ steps.release.outputs.prerelease == 'true' && '--prerelease' || '' }}
          fi

      # Last: the artifacts above are what the formula's default install needs,
      # and a registry refusing this push must not take them down with it.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.tags }}
