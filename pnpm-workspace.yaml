overrides:
  # ajv (via the webpack build chain) resolves a fast-uri with the host
  # confusion and SSRF advisories GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf and GHSA-jqff-g426-hqxp. Those were fixed in 4.1.3,
  # and two further advisories since then move the floor to 4.1.5. The
  # previous ">=4.1.3" was itself satisfied by 4.1.3, so the pin held the tree
  # on a version that is now vulnerable - a range override floors the version,
  # it does not track the advisory. Raise it with the advisory rather than
  # assuming the old pin still covers it. Drop this once `pnpm why fast-uri`
  # shows >=4.1.5 without the override.
  fast-uri: ">=4.1.5"
  # The same build chain (webpack's CSS minimizer, cssnano) resolves svgo
  # 2.8.3 (GHSA-4vpr-x523-8j87 and a second removeScripts advisory, fixed in
  # 2.8.4), colord 2.9.3 (slow rejection of malformed colours, fixed in
  # 2.9.4) and js-yaml 4.3.1 (maxTotalMergeKeys CPU, fixed in 4.3.2). Each is
  # pinned within its own major so nothing that depends on it moves API.
  # Drop them once `pnpm why` shows patched versions without the override.
  "svgo@>=1.0.0 <2.8.4": "^2.8.4"
  "colord@<2.9.4": "^2.9.4"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  # @vue/compiler-core resolves source-map-js 1.2.1, with the ReDoS in its
  # mapping parser fixed in 1.2.2. A patch bump within the major already in
  # the tree.
  source-map-js: ">=1.2.2"
  # cssnano, in the same webpack chain, resolves postcss-selector-parser 7.1.5
  # and - through postcss-calc, stylehacks and postcss-merge-rules - 6.1.4.
  # The quadratic selector parsing has no fix in 6.x, so pinning only the 7
  # line left those 6.1.4 copies flagged; this pin moves them across a major
  # instead. Nothing ships it to the browser, it only minifies our own CSS at
  # build time, and what justifies the major is that a full `pnpm build`
  # produces the same minified output - which the frontend job runs.
  postcss-selector-parser: ">=7.1.6"

packages:
  - '.'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - yorkie
allowBuilds:
  core-js: set this to true or false
  yorkie: set this to true or false
