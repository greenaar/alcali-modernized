# Forgejo Actions pipeline.
#
# Runner requirements:
#   - a runner registered with the `ubuntu-latest` label (act_runner maps it to
#     a Debian-based node image by default);
#   - the `container` job additionally needs a runner allowed to reach a Docker
#     daemon (privileged runner or a mounted /var/run/docker.sock).
#
# Actions are referenced by absolute URL so they resolve identically whatever
# DEFAULT_ACTIONS_URL the Forgejo instance is configured with.
name: CI

on:
  push:
    # Every branch, but no tags: release.yml runs the same gates before it
    # publishes anything. Expressed as a branch pattern rather than
    # tags-ignore, because Forgejo requires each declared condition to match
    # and a tag condition never matches a branch push -- with tags-ignore
    # alone, branch pushes stop triggering CI altogether.
    branches:
      - '**'
  pull_request:
  workflow_dispatch:


jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements/prod.txt -r requirements/test.txt
      - name: Check Django configuration
        env:
          DB_BACKEND: sqlite3
          SECRET_KEY: ci-only
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run unit tests
        env:
          DB_BACKEND: sqlite3
          SECRET_KEY: ci-only
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm audit --prod

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/docker/setup-buildx-action@v3
      - uses: https://code.forgejo.org/docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: alcali:test
