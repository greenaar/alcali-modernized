# Builds the MkDocs site and republishes it to the `pages` branch.
#
# Forgejo has no hosted equivalent of GitHub Pages: the built site is pushed to
# an orphan `pages` branch, which is what a Forgejo/Codeberg pages server (or a
# reverse proxy checking that branch out) serves. Every run force-replaces the
# branch content, so keep no hand-edited files there.
#
# Requires the automatic `FORGEJO_TOKEN` to have write access to this
# repository (Repository settings -> Actions).
name: docs

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - docs/**
      - requirements/docs.txt
      - .forgejo/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup Python
        uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/docs.txt

      - name: Build site
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r ../requirements/docs.txt
          mkdocs build --strict

      - name: Upload site
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/site

      - name: Publish to the pages branch
        if: github.event_name != 'pull_request'
        working-directory: docs/site
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          test -n "${FORGEJO_TOKEN}" || {
            echo "FORGEJO_TOKEN is empty; enable Actions write access for this repository." >&2
            exit 1
          }
          git init --quiet --initial-branch pages .
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.localhost"
          git add --all
          git commit --quiet --message "docs: build ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${FORGEJO_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            pages
