# Release pipeline: builds the Python distributions and the container image for
# a tagged version, publishes both to this Forgejo instance's package
# registries, and attaches the Python files to the Forgejo release entry.
#
# Runner requirements: the `ubuntu-latest` label, plus access to a Docker
# daemon for the image build (same requirement as the `container` job in
# ci.yml).
#
# Tokens: the automatic FORGEJO_TOKEN is used for both registries and for the
# release entry. If the instance does not let the automatic token write
# packages, add a PACKAGES_TOKEN secret holding a personal access token with
# the `write:package` scope; it takes precedence when present.
name: release

on:
  push:
    tags:
      - v*
  # Re-run a release without moving the tag: the workflow file comes from the
  # default branch, the code from the tag named here.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v3008.2.0'
        required: true
        type: string
      registry_host:
        description: 'Registry host for the image, e.g. forge.thatserver.ca (overrides the variable)'
        required: false
        type: string

# No `permissions:` block: Forgejo ignores it and warns about it. The automatic
# FORGEJO_TOKEN has deliberately limited capabilities; if the registry uploads
# or the release upload are refused, grant them with an Authorized Integration
# (Settings -> Authorized Integrations) rather than a permissions field.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version and registry
        id: release
        env:
          # Optional repository variables. The job container and the Docker
          # daemon do not necessarily reach Forgejo the same way, so they get
          # separate overrides; both default to the address the checkout used.
          #
          # FORGE_URL     - used by twine and the release upload, which run in
          #                 the job container.
          # REGISTRY_HOST - host the image is tagged with and pushed to, used
          #                 by the daemon. Set this to the public name when the
          #                 internal address is plain HTTP, otherwise the push
          #                 needs dockerd --insecure-registry.
          # Taken from a dispatch input, an Actions variable or a secret,
          # in that order: variables and secrets are separate stores and it is
          # easy to add one where the other is read from.
          VAR_FORGE_URL: ${{ vars.FORGE_URL }}
          SECRET_FORGE_URL: ${{ secrets.FORGE_URL }}
          VAR_REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          SECRET_REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          INPUT_REGISTRY_HOST: ${{ github.event.inputs.registry_host }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          ref_name="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="${ref_name#v}"
          declared="$(tr -d '[:space:]' < VERSION)"
          if [ "${version}" != "${declared}" ]; then
            echo "Tag ${ref_name} declares version ${version}, but the VERSION" >&2
            echo "file contains ${declared}. Update VERSION in the same commit the tag" >&2
            echo "points at, otherwise the published package would carry a version that" >&2
            echo "does not match the release." >&2
            exit 1
          fi

          # Same reasoning as the docs workflow: trust the address the checkout
          # actually used rather than an instance ROOT_URL that may not resolve
          # from the runner.
          if [ -n "${VAR_FORGE_URL}" ]; then
            FORGE_URL="${VAR_FORGE_URL}"; forge_src="variable"
          elif [ -n "${SECRET_FORGE_URL}" ]; then
            FORGE_URL="${SECRET_FORGE_URL}"; forge_src="secret"
          else
            FORGE_URL=""; forge_src="unset, using the checkout address"
          fi

          if [ -n "${INPUT_REGISTRY_HOST}" ]; then
            REGISTRY_HOST="${INPUT_REGISTRY_HOST}"; registry_src="dispatch input"
          elif [ -n "${VAR_REGISTRY_HOST}" ]; then
            REGISTRY_HOST="${VAR_REGISTRY_HOST}"; registry_src="variable"
          elif [ -n "${SECRET_REGISTRY_HOST}" ]; then
            REGISTRY_HOST="${SECRET_REGISTRY_HOST}"; registry_src="secret"
          else
            REGISTRY_HOST=""; registry_src="unset, using the forge host"
          fi

          origin="${FORGE_URL:-$(git remote get-url origin)}"
          case "${origin}" in
            http://*|https://*)
              scheme="${origin%%://*}"
              host="${origin#*://}"
              host="${host#*@}"
              host="${host%%/*}"
              ;;
            *)
              scheme="${GITHUB_SERVER_URL%%://*}"
              host="${GITHUB_SERVER_URL#*://}"
              host="${host%%/*}"
              ;;
          esac
          owner="${GITHUB_REPOSITORY%%/*}"

          case "${version}" in
            *dev*|*a[0-9]*|*b[0-9]*|*rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          registry="${REGISTRY_HOST:-${host}}"
          image="${registry}/${owner}/alcali"

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "registry=${registry}"
            echo "host=${host}"
            echo "server=${scheme}://${host}"
            echo "pypi=${scheme}://${host}/api/packages/${owner}/pypi"
            echo "image=${image}"
            # A prerelease must not move :latest.
            echo "tag=${ref_name}"
            echo "tags<<EOF"
            echo "${image}:${version}"
            if [ "${prerelease}" = "false" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          # Print what was resolved: an unset FORGE_URL/REGISTRY_HOST is
          # otherwise only visible once a later step talks to the wrong host.
          echo "tag           : ${ref_name}"
          echo "version       : ${version} (prerelease=${prerelease})"
          echo "forge url     : ${scheme}://${host}   (FORGE_URL from ${forge_src})"
          echo "registry host : ${registry}   (REGISTRY_HOST from ${registry_src})"
          echo "image         : ${image}:${version}"

      - name: Run unit tests
        env:
          DB_BACKEND: sqlite3
          SECRET_KEY: ci-only
        run: |
          python -m pip install -r requirements/prod.txt -r requirements/test.txt
          pytest

      # dist/ holds the committed frontend bundle, so the Python build has to
      # write somewhere else or it would land inside the shipped assets.
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir build/release
          python -m twine check build/release/*

      - name: Publish to the package registry
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.PACKAGES_TOKEN || secrets.FORGEJO_TOKEN }}
          TWINE_REPOSITORY_URL: ${{ steps.release.outputs.pypi }}
        run: |
          test -n "${TWINE_PASSWORD}" || {
            echo "No token resolved for the package registry." >&2
            echo "Add a PACKAGES_TOKEN secret holding an access token with the" >&2
            echo "write:package scope; the automatic FORGEJO_TOKEN cannot write" >&2
            echo "packages." >&2
            exit 1
          }
          # Not --skip-existing: twine only honours that for repositories on
          # its own allow-list and refuses a Forgejo registry URL outright.
          # Tolerate the registry's 409 instead, so a re-run of an already
          # published version continues to the image and release steps.
          if python -m twine upload --non-interactive build/release/* >/tmp/twine.log 2>&1; then
            cat /tmp/twine.log
            echo "=> published"
          else
            cat /tmp/twine.log
            if grep -qiE '409|conflict|already exist' /tmp/twine.log; then
              echo "=> this version is already in the registry; its existing files"
              echo "   are kept. Delete the version in the Packages UI first if the"
              echo "   contents changed."
            else
              exit 1
            fi
          fi

      - name: Refuse to push to a plain-HTTP registry
        run: |
          case "${{ steps.release.outputs.server }}" in
            http://*)
              if [ "${{ steps.release.outputs.registry }}" = "${{ steps.release.outputs.host }}" ]; then
                echo "The image would be pushed to ${{ steps.release.outputs.registry }}," >&2
                echo "which serves plain HTTP: the daemon will refuse it unless it was" >&2
                echo "started with --insecure-registry for that host." >&2
                echo "Set REGISTRY_HOST (Settings -> Actions -> Variables) to the public" >&2
                echo "name, or pass registry_host when dispatching this workflow." >&2
                exit 1
              fi
              ;;
          esac

      - uses: https://code.forgejo.org/docker/setup-buildx-action@v3

      - uses: https://code.forgejo.org/docker/login-action@v3
        with:
          registry: ${{ steps.release.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN || secrets.FORGEJO_TOKEN }}

      - name: Build and push the container image
        uses: https://code.forgejo.org/docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.tags }}

      - name: Attach the distributions to the release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ steps.release.outputs.server }}
          repo: ${{ github.repository }}
          tag: ${{ steps.release.outputs.tag }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          release-dir: build/release
          prerelease: ${{ steps.release.outputs.prerelease }}
          override: true
