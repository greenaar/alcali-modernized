[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
# python_paths = backend/
addopts =
    -v
    --capture=no
    --showlocals
    -p no:cacheprovider
    --cov=.
    --cov-config=.coveragerc
    --cov-report term-missing
    --no-cov-on-fail
    --color yes
    -m "not integration and not smoke"
markers =
    integration: requires a running Salt master, salt-api, and SQL returner
    smoke: drives the built frontend in a browser; needs `pnpm build` and playwright
